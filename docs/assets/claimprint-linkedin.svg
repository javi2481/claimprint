<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Claimprint — LinkedIn post card</title>
  <desc id="d">Portfolio post: claims intelligence kernel, typed claims before RAG, no claim no answer. v1.0 BYMA pilot metrics frozen at Gate 3.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="claimGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
    <marker id="arrI" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#818CF8"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent glow behind hero claim -->
  <ellipse cx="520" cy="340" rx="200" ry="120" fill="#6366F1" opacity="0.08"/>

  <!-- ═══ HEADER — LinkedIn hook ═══ -->
  <text x="60" y="72" font-family="Inter, system-ui, Segoe UI, sans-serif" font-size="48" font-weight="800" fill="#F8FAFC" letter-spacing="-2">CLAIMPRINT</text>
  <text x="60" y="108" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#818CF8">Claims Intelligence kernel</text>
  <text x="60" y="142" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#94A3B8">Not a RAG wrapper — documents become verified claims first</text>
  <text x="1140" y="72" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6366F1" letter-spacing="1">v1.0</text>

  <!-- Identity trap — README numbers -->
  <g transform="translate(60, 158)">
    <rect x="0" y="0" width="1080" height="52" rx="10" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FB923C">IDENTITY TRAP</text>
    <text x="24" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">net income 1T26 without scope → neighbor row</text>
    <text x="430" y="32" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" fill="#2DD4BF">21.262.335</text>
    <text x="430" y="46" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">consolidado</text>
    <text x="540" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#475569">≠</text>
    <text x="650" y="32" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" fill="#F8FAFC">21.259.769</text>
    <text x="650" y="46" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FB923C">controlante</text>
    <text x="900" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#818CF8">kernel picks identity</text>
  </g>

  <!-- ═══ MAIN SPINE — 4 beats, large labels ═══ -->
  <g transform="translate(0, 228)">

    <!-- DOCUMENT -->
    <g transform="translate(40, 12)">
      <rect x="0" y="0" width="110" height="96" rx="14" fill="#131B2E" stroke="#334155" stroke-width="1.5"/>
      <rect x="34" y="20" width="42" height="48" rx="4" fill="none" stroke="#64748B" stroke-width="2"/>
      <path d="M52 20 L52 32 L76 32" stroke="#64748B" stroke-width="2" fill="none"/>
      <text x="55" y="84" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">DOCUMENT</text>
    </g>
    <line x1="160" y1="60" x2="195" y2="60" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/>

    <!-- DOC INTELLIGENCE -->
    <g transform="translate(205, 20)">
      <rect x="0" y="0" width="175" height="80" rx="12" fill="#131B2E" stroke="#38BDF8" stroke-width="2"/>
      <text x="87" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">DOC INTELLIGENCE</text>
      <text x="87" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">parse · classify · extract</text>
    </g>
    <line x1="390" y1="60" x2="425" y2="60" stroke="#818CF8" stroke-width="3" marker-end="url(#arrI)"/>

    <!-- TYPED CLAIM — hero -->
    <g transform="translate(435, -8)">
      <rect x="0" y="0" width="290" height="136" rx="18" fill="url(#claimGlow)"/>
      <text x="145" y="52" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">TYPED CLAIM</text>
      <text x="145" y="84" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#C7D2FE">identity · value · provenance</text>
      <text x="145" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#E0E7FF">source of truth</text>
    </g>
    <line x1="735" y1="60" x2="770" y2="60" stroke="#818CF8" stroke-width="3" marker-end="url(#arrI)"/>

    <!-- VERIFY -->
    <g transform="translate(780, 20)">
      <rect x="0" y="0" width="155" height="80" rx="12" fill="#131B2E" stroke="#818CF8" stroke-width="2"/>
      <text x="77" y="38" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#C7D2FE">IDENTITY</text>
      <text x="77" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#C7D2FE">+ VERIFY</text>
    </g>
    <line x1="945" y1="60" x2="980" y2="60" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arrG)"/>

    <!-- VERIFIED ANSWER -->
    <g transform="translate(990, 0)">
      <rect x="0" y="0" width="170" height="120" rx="14" fill="#0D2818" stroke="#2DD4BF" stroke-width="2.5"/>
      <text x="85" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#2DD4BF">VERIFIED</text>
      <text x="85" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#2DD4BF">ANSWER</text>
    </g>
  </g>

  <!-- RAG — minimal secondary -->
  <path d="M580 372 L580 400 L720 400" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arr)"/>
  <text x="740" y="406" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748B">RAG · optional · consumes claims</text>

  <!-- Pilot metrics — Gate 3 frozen, honest small-n -->
  <g transform="translate(60, 418)">
    <rect x="0" y="0" width="1080" height="44" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">BYMA PILOT · SMALL-N · NOT PAPER IR</text>
    <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Retrieval Recall@5</text>
    <text x="148" y="34" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#64748B">0.35</text>
    <text x="210" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">MRR</text>
    <text x="250" y="34" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#64748B">0.2042</text>
    <text x="340" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Claims-first chat (n=10)</text>
    <text x="520" y="34" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#818CF8">1.0</text>
    <text x="560" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">answer · citation · evidence · abstention</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(60, 478)">
    <rect x="0" y="0" width="1080" height="72" rx="14" fill="#1C1410" stroke="#FB923C" stroke-width="2"/>
    <text x="540" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" fill="#FB923C" letter-spacing="1.5">NO CLAIM · NO ANSWER</text>
    <text x="540" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#A8A29E">without verified identity the kernel abstains</text>
  </g>

  <!-- Footer — portfolio CTA -->
  <text x="60" y="598" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Finance / BYMA · academic portfolio project</text>
  <text x="1140" y="598" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#818CF8">github.com/javi2481/claimprint</text>
</svg>
