<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Claimprint — claims-first IDP layer</title>
  <desc id="d">Documents become typed verified claims before RAG answers. No claim, no answer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="claimGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrI" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6366F1"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2DD4BF"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,10 L10,0 Z" fill="#FB923C"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#6366F1" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
  </g>

  <!-- Header -->
  <text x="60" y="48" font-family="Inter, system-ui, Segoe UI, sans-serif" font-size="32" font-weight="800" fill="#F8FAFC" letter-spacing="-1">CLAIMPRINT</text>
  <text x="60" y="74" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748B">Claims-first IDP layer · First instance: Finance / BYMA</text>
  <text x="60" y="98" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Documents become verifiable claims before RAG is allowed to answer</text>

  <!-- Main spine -->
  <g transform="translate(0, 228)">

    <g transform="translate(48, 0)">
      <rect x="0" y="0" width="100" height="100" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="32" y="22" width="36" height="44" rx="4" fill="none" stroke="#64748B" stroke-width="2"/>
      <path d="M50 22 L50 34 L68 34" stroke="#64748B" stroke-width="2" fill="none"/>
      <line x1="38" y1="44" x2="62" y2="44" stroke="#334155" stroke-width="2"/>
      <line x1="38" y1="54" x2="56" y2="54" stroke="#334155" stroke-width="2"/>
      <text x="50" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">DOCUMENT</text>
    </g>

    <line x1="158" y1="50" x2="188" y2="50" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

    <g transform="translate(198, 10)">
      <rect x="0" y="0" width="168" height="80" rx="12" fill="#131B2E" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="84" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">DOC INTELLIGENCE</text>
      <text x="84" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">classify · extract</text>
    </g>

    <line x1="376" y1="50" x2="406" y2="50" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrI)"/>

    <g transform="translate(416, -16)">
      <rect x="0" y="0" width="268" height="132" rx="16" fill="url(#claimGlow)"/>
      <text x="134" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">TYPED CLAIM</text>
      <text x="134" y="76" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#C7D2FE">identity · value · provenance</text>
      <text x="134" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#A5B4FC">source of truth</text>
    </g>

    <line x1="694" y1="50" x2="724" y2="50" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrI)"/>

    <g transform="translate(734, 10)">
      <rect x="0" y="0" width="168" height="80" rx="12" fill="#131B2E" stroke="#6366F1" stroke-width="1.5"/>
      <text x="84" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#A5B4FC">IDENTITY</text>
      <text x="84" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#A5B4FC">+ VERIFY</text>
    </g>

    <line x1="912" y1="50" x2="942" y2="50" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrG)"/>

    <g transform="translate(952, -8)">
      <rect x="0" y="0" width="200" height="116" rx="14" fill="#0D2818" stroke="#2DD4BF" stroke-width="2"/>
      <text x="100" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#2DD4BF">VERIFIED</text>
      <text x="100" y="72" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#2DD4BF">ANSWER</text>
      <text x="100" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#047857">exact lookup</text>
    </g>
  </g>

  <!-- Step captions -->
  <g font-family="Inter, system-ui, sans-serif" font-size="10" fill="#475569">
    <text x="98" y="348" text-anchor="middle">PDF filing</text>
    <text x="282" y="348" text-anchor="middle">parse · recipe · schema</text>
    <text x="550" y="348" text-anchor="middle">structured figure</text>
    <text x="818" y="348" text-anchor="middle">resolve ambiguity</text>
    <text x="1052" y="348" text-anchor="middle">or abstain</text>
  </g>

  <!-- RAG secondary -->
  <path d="M550 354 L550 388 L680 388 L680 412" stroke="#334155" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#arr)"/>
  <g transform="translate(580, 416)">
    <rect x="0" y="0" width="200" height="56" rx="10" fill="#131B2E" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="100" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748B">RAG · optional</text>
    <text x="100" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#475569">grounded chat · consumes claims</text>
  </g>

  <!-- Abstain path hint -->
  <path d="M818 348 L818 378 L700 378 L700 412" stroke="#FB923C" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrO)"/>

  <!-- Tagline -->
  <g transform="translate(60, 496)">
    <rect x="0" y="0" width="1080" height="64" rx="12" fill="#1C1410" stroke="#FB923C" stroke-width="1.5"/>
    <text x="540" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FB923C" letter-spacing="1">NO CLAIM · NO ANSWER</text>
    <text x="540" y="52" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#78716C">without a verified claim Claimprint abstains — chat is not the source of truth</text>
  </g>

  <!-- Footer -->
  <text x="60" y="608" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">Finance / BYMA · academic portfolio project</text>
  <text x="1140" y="608" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">typed claims = source of truth · RAG is optional</text>
</svg>
