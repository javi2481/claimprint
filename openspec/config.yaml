# openspec/config.yaml
schema: spec-driven
project: claimprint
persistence: hybrid
strict_tdd: false

context: |
  Product: Claimprint is a claims intelligence kernel; the shipped plugin is finance IDP over docs/archivos_muestra/ (BYMA). MinerU parse feeds typed claims and RAGFlow chat. Active OpenSpec change: claimprint-v1.1-three-wp (post-v1: content-first period, ablation, MinerU provenance). Closed: claimprint-v1-close (v1.0.0). Gate 3 metrics frozen: Recall@5 0.35, MRR 0.2042, chat 1.0/10 — do not edit without new gate. Parse SoT is fixtures/mineru/*.md plus committed *.content.json sidecars (MinerU API preferred at export; RAGFlow positions fallback in CI).
  UI/stack pin (do not inflate with IDP work): RAGFlow v0.26.4 + Infinity + MinerU pipeline sidecar + Mistral mistral-small-latest + Voyage (openspec change claimprint-ragflow; live SoT = README / v1.0.0). Chat inject is scripts/push_claims.py from kernel claims — not a second gold JSON.
  Runtime IDP: ./scripts/check.sh (pytest) on any host with MinerU fixtures. Runtime UI: Docker Compose, x86_64, ≥16 GB. Do not introduce a custom product UI; the UI is pinned RAGFlow.
  Persistence: hybrid (openspec files + Engram observations, project claimprint).
  Docs: product changes update README.md + the open change in the same work unit. Pin / Compose / .env.example stay on the stack track.
  Testing: ./scripts/check.sh runs file contracts + pytest identity. RAG E2E is manual on ≥16 GB and is not the IDP DoD. strict_tdd stays false.

testing:
  strict_tdd: false
  strict_tdd_reason: "scripts/check.sh runs contracts + pytest for IDP layers 1-2. RAGFlow E2E stays manual on ≥16 GB. Strict TDD stays disabled."
  runner:
    command: "./scripts/check.sh"
    framework: bash
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: ""
    type_checker: ""
    formatter: ""

rules:
  proposal:
    - Include rollback plan for risky changes
    - Do not propose a custom product UI; the UI is pinned RAGFlow over BYMA samples
    - Keep the product as a finance IDP on docs/archivos_muestra/
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Answers MUST be in Spanish and MUST cite retrieved evidence
    - When evidence is missing, the system MUST return an empty/no-evidence reply instead of inventing
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Compose RAGFlow + Infinity + Mistral chat + Voyage embed; MinerU pipeline default parser; Ollama last fallback; PaddleOCR optional; do not introduce a custom product UI
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Use BYMA sample PDFs in docs/archivos_muestra/; do not invent filings
    tdd: false
    test_command: "./scripts/check.sh"
  verify:
    test_command: "./scripts/check.sh"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
